<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="book.css">
</head>
<body>
    
   <div class="container">
        <div class="header">
            <h2>Book an Appointment</h2>
            <p>Please fill in your details below.</p>
        </div>

        <form action="#" method="POST">
        
            <div class="form-group">
                <label for="fullname">Full Name</label>
                <input type="text" id="fullname" name="fullname" placeholder="Enter your full name" required>
            </div>

            <div class="form-group">
                <label for="card_number">Hospital Card Number / Patient ID</label>
                <input type="text" id="card_number" n placeholder="e.g. PAT-00256" required>
            </div>

            
            <div class="form-row">
                <div class="form-group">
                    <label for="phone">Phone Number</label>
                    <input type="tel" id="phone" placeholder="e.g. 08012345678" required>
                </div>
                <div class="form-group">
                    <label for="email">Email Address</label>
                    <input type="email" id="email" placeholder="example@mail.com" required>
                </div>
            </div>

            
            <div class="form-row">
                <div class="form-group">
                    <label for="date">Preferred Date</label>
                    <input type="date" id="date"  required>
                </div>
                <div class="form-group">
                    <label for="time">Preferred Time</label>
                    <input type="time" id="time"  required>
                </div>
            </div>

            
            <div class="form-group">
                <label for="reason">Reason for Appointment</label>
                <textarea id="reason" placeholder="Briefly describe your reason for visiting..." required></textarea>
            </div>

    
            <button type="submit" class="submit-btn">Book Appointment Now</button>
        </form>
    </div>

</body>
</html>
